<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- One node on the network, which is the same motif as the backdrop and the
       nav rail. Kept to a single lit node plus four filaments so it still reads
       at 16px in a browser tab. -->
  <rect width="32" height="32" rx="7" fill="#0b120f"/>
  <g stroke="#e8b466" stroke-linecap="round" fill="none">
    <g stroke-width="1.1" opacity="0.4">
      <path d="M16 16 L5 7"/>
      <path d="M16 16 L27 9"/>
      <path d="M16 16 L7 26"/>
      <path d="M16 16 L26 24"/>
    </g>
    <g fill="#e8b466" stroke="none" opacity="0.75">
      <circle cx="5" cy="7" r="1.6"/>
      <circle cx="27" cy="9" r="1.4"/>
      <circle cx="7" cy="26" r="1.4"/>
      <circle cx="26" cy="24" r="1.6"/>
    </g>
  </g>
  <circle cx="16" cy="16" r="6" fill="#e8b466" opacity="0.22"/>
  <circle cx="16" cy="16" r="3.6" fill="#fff1d0"/>
</svg>
